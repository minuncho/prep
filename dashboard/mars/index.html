<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=5">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page">
    <h1 class="page-title">My calendar</h1>

    <section class="card">
      <h2>Weekly Calendar</h2>
      <div class="range">
        <span class="label" id="range"></span>
        <span>
          <button id="prev" aria-label="Previous week">‹</button>
          <button id="next" aria-label="Next week">›</button>
        </span>
      </div>
      <div class="filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="mission"><span class="dot"></span>Mission</button>
        <button class="chip" data-filter="biomarkers"><span class="dot"></span>Biomarkers</button>
        <button class="chip" data-filter="meals"><span class="dot"></span>Meals</button>
        <button class="chip" data-filter="alerts">Alerts only</button>
      </div>
      <div class="week" id="week"></div>
    </section>

    <div class="bottom">
      <section class="card">
        <h2>Data Log</h2>
        <p class="sub" id="log-sub"></p>
        <div class="log-scroll">
          <table>
            <thead><tr><th>Mission time</th><th>Health check</th><th>Value / Status</th></tr></thead>
            <tbody id="log"></tbody>
          </table>
        </div>
      </section>
      <section class="card">
        <h2>Recent Conversation</h2>
        <p class="sub" id="recent-who"></p>
        <div class="bubble" id="recent-bubble"></div>
        <a class="cta" id="recent-link" href="conversation.html">Open conversation</a>
      </section>
    </div>
  </main>

  <script src="../common.js?v=5"></script>
  <script src="../calendar.js?v=5"></script>
</body>
</html>
